name: Release PR

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Create or update release PR
    if: github.repository == 'modekit/modekit' && vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Create short-lived release-app token
        id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: modekit
          repositories: modekit

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: changesets-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      - name: Create or update the release pull request
        if: steps.changesets-mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-app.outputs.token }}
          script: pnpm release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          pr-draft: create
          pr-base-branch: main
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
