name: Bug report
description: Report reproducible incorrect behavior in ModeKit.
title: 'Bug: '
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository, playground, or exact steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installed ModeKit version
      placeholder: '@modekit/vue 0.x.x'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Vue, browser, operating system, Node, package manager, and SSR framework when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
